name: evaOS Runtime Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Internal evaOS Paperclip runtime version
        required: true
        type: string
      dry_run:
        description: Build and upload the workflow artifact without creating a GitHub Release
        required: true
        type: boolean
        default: true
      prerelease:
        description: Mark the GitHub Release as a prerelease
        required: true
        type: boolean
        default: true

concurrency:
  group: evaos-runtime-release-${{ inputs.version }}
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}

    steps:
      - name: Validate release inputs
        env:
          EVAOS_ARTIFACT_VERSION: ${{ inputs.version }}
          EVAOS_ARTIFACT_DRY_RUN: ${{ inputs.dry_run }}
          EVAOS_RELEASE_REF: ${{ github.ref }}
        run: |
          case "$EVAOS_ARTIFACT_VERSION" in
            ""|*[!0-9A-Za-z._-]*)
              echo "Invalid evaOS artifact version" >&2
              exit 2
              ;;
          esac
          if [[ "$EVAOS_ARTIFACT_DRY_RUN" != "true" && "$EVAOS_RELEASE_REF" != "refs/heads/master" ]]; then
            echo "Published evaOS runtime releases must be dispatched from master" >&2
            exit 2
          fi

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Verify exact source commit
        id: source
        env:
          EVAOS_ARTIFACT_SOURCE_REF: ${{ github.sha }}
        run: |
          source_sha="$(git rev-parse HEAD)"
          test "$source_sha" = "$EVAOS_ARTIFACT_SOURCE_REF"
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          package-manager-cache: false

      - name: Validate release package manifest
        run: node ./scripts/release-package-map.mjs check

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build evaOS runtime artifact
        env:
          EVAOS_ARTIFACT_VERSION: ${{ inputs.version }}
          EVAOS_ARTIFACT_SOURCE_REF: ${{ steps.source.outputs.sha }}
          EVAOS_ARTIFACT_OUT_DIR: ${{ runner.temp }}/evaos-artifacts
        run: |
          ./scripts/build-evaos-runtime-artifact.sh \
            --version "$EVAOS_ARTIFACT_VERSION" \
            --source-ref "$EVAOS_ARTIFACT_SOURCE_REF" \
            --out-dir "$EVAOS_ARTIFACT_OUT_DIR"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: evaos-paperclip-runtime-${{ inputs.version }}
          path: |
            ${{ runner.temp }}/evaos-artifacts/*.tgz
            ${{ runner.temp }}/evaos-artifacts/*.sha256
            ${{ runner.temp }}/evaos-artifacts/manifest.json
          if-no-files-found: error

  publish:
    if: ${{ ! inputs.dry_run }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download verified runtime artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: evaos-paperclip-runtime-${{ inputs.version }}
          path: ${{ runner.temp }}/evaos-artifacts

      - name: Verify downloaded artifact receipt
        env:
          EVAOS_ARTIFACT_SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
        run: |
          test "$(jq -r '.sourceSha' "$RUNNER_TEMP/evaos-artifacts/manifest.json")" = "$EVAOS_ARTIFACT_SOURCE_SHA"
          (
            cd "$RUNNER_TEMP/evaos-artifacts"
            sha256sum --check ./*.sha256
          )

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVAOS_ARTIFACT_VERSION: ${{ inputs.version }}
          EVAOS_ARTIFACT_SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
          EVAOS_ARTIFACT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          tag="evaos-paperclip/v${EVAOS_ARTIFACT_VERSION}"
          encoded_tag="$(jq -rn --arg value "$tag" '$value | @uri')"
          if gh api "repos/${GH_REPO}/git/ref/tags/${encoded_tag}" >/dev/null 2>&1; then
            existing_sha="$(gh api "repos/${GH_REPO}/commits/${encoded_tag}" --jq .sha)"
            test "$existing_sha" = "$EVAOS_ARTIFACT_SOURCE_SHA"
          fi
          args=(
            release create "$tag"
            "$RUNNER_TEMP"/evaos-artifacts/*.tgz
            "$RUNNER_TEMP"/evaos-artifacts/*.sha256
            "$RUNNER_TEMP"/evaos-artifacts/manifest.json
            --title "evaOS Paperclip Runtime ${EVAOS_ARTIFACT_VERSION}"
            --target "$EVAOS_ARTIFACT_SOURCE_SHA"
            --notes "Internal evaOS/RVM Paperclip runtime artifact built from exact commit ${EVAOS_ARTIFACT_SOURCE_SHA}."
          )
          if [[ "$EVAOS_ARTIFACT_PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh "${args[@]}"
